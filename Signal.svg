<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Mecverse product portfolio — FlowTux, WorkClave, HZRelay" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#09090B" stop-opacity="1"/>
      <stop offset="0.10" stop-color="#09090B" stop-opacity="0"/>
      <stop offset="0.90" stop-color="#09090B" stop-opacity="0"/>
      <stop offset="1"    stop-color="#09090B" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="20%" r="65%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <path id="lane1" d="M330,128 H880"/>
    <path id="lane2" d="M330,168 H880"/>
    <path id="lane3" d="M330,208 H880"/>

    <style>
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }

      .head  { animation: rise 900ms cubic-bezier(.2,.7,.2,1) both; }
      .lanes { animation: rise 900ms cubic-bezier(.2,.7,.2,1) 220ms both; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .node { animation: ping 3.2s ease-in-out infinite; }
      @keyframes ping {
        0%, 22%, 100% { r: 3;   fill-opacity: .35; }
        8%            { r: 5.5; fill-opacity: 1;   }
      }

      .l1 .node:nth-of-type(1) { animation-delay: 0s;    }
      .l1 .node:nth-of-type(2) { animation-delay: .72s;  }
      .l1 .node:nth-of-type(3) { animation-delay: 1.44s; }
      .l1 .node:nth-of-type(4) { animation-delay: 2.16s; }

      .l2 .node:nth-of-type(1) { animation-delay: .5s;   }
      .l2 .node:nth-of-type(2) { animation-delay: 1.22s; }
      .l2 .node:nth-of-type(3) { animation-delay: 1.94s; }
      .l2 .node:nth-of-type(4) { animation-delay: 2.66s; }

      .l3 .node:nth-of-type(1) { animation-delay: 1s;    }
      .l3 .node:nth-of-type(2) { animation-delay: 1.72s; }
      .l3 .node:nth-of-type(3) { animation-delay: 2.44s; }
      .l3 .node:nth-of-type(4) { animation-delay: .12s;  }

      .status { animation: blink 2.4s steps(1,end) infinite; }
      @keyframes blink { 0%,60% { opacity: 1; } 61%,100% { opacity: .25; } }

      .drift { animation: drift 24s linear infinite; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-40px); } }
    </style>
  </defs>

  <rect width="1200" height="250" fill="#09090B"/>
  <g class="drift"><rect x="-40" y="0" width="1280" height="250" fill="url(#grid)"/></g>
  <rect width="1200" height="250" fill="url(#glow)"/>

  <g class="head">
    <circle class="status" cx="332" cy="40" r="3.2" fill="#FFFFFF"/>
    <text class="mono" x="348" y="44" font-size="11" letter-spacing="2.4" fill="#8A8A93">PORTFOLIO ONLINE</text>
    <text class="mono" x="880" y="44" text-anchor="end" font-size="11" letter-spacing="2.4" fill="#5B5B63">MECVERSE TECH SOLUTIONS LLP</text>
    <text class="mono" x="332" y="86" font-size="14" letter-spacing="3.6" fill="#FFFFFF">SOFTWARE PRODUCTS FOR MODERN OPERATIONAL TEAMS</text>
  </g>

  <g class="lanes">

    <g class="l1">
      <text class="mono" x="310" y="132" text-anchor="end" font-size="12" letter-spacing="2.6" fill="#FFFFFF">FLOWTUX</text>
      <line x1="330" y1="128" x2="880" y2="128" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <circle class="node" cx="330" cy="128" r="3" fill="#FFFFFF"/>
      <circle class="node" cx="513" cy="128" r="3" fill="#FFFFFF"/>
      <circle class="node" cx="696" cy="128" r="3" fill="#FFFFFF"/>
      <circle class="node" cx="880" cy="128" r="3" fill="#FFFFFF"/>
      <circle r="3.4" fill="#FFFFFF">
        <animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#lane1"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text class="mono" x="900" y="132" font-size="11" letter-spacing="1.8" fill="#5B5B63">73% AUTO-RESOLVED</text>
    </g>

    <g class="l2">
      <text class="mono" x="310" y="172" text-anchor="end" font-size="12" letter-spacing="2.6" fill="#FFFFFF">WORKCLAVE</text>
      <line x1="330" y1="168" x2="880" y2="168" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <circle class="node" cx="330" cy="168" r="3" fill="#FFFFFF"/>
      <circle class="node" cx="513" cy="168" r="3" fill="#FFFFFF"/>
      <circle class="node" cx="696" cy="168" r="3" fill="#FFFFFF"/>
      <circle class="node" cx="880" cy="168" r="3" fill="#FFFFFF"/>
      <circle r="3.4" fill="#FFFFFF">
        <animateMotion dur="3.2s" begin="0.5s" repeatCount="indefinite"><mpath href="#lane2"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="3.2s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text class="mono" x="900" y="172" font-size="11" letter-spacing="1.8" fill="#5B5B63">SESSION VERIFIED</text>
    </g>

    <g class="l3">
      <text class="mono" x="310" y="212" text-anchor="end" font-size="12" letter-spacing="2.6" fill="#FFFFFF">HZRELAY</text>
      <line x1="330" y1="208" x2="880" y2="208" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <circle class="node" cx="330" cy="208" r="3" fill="#FFFFFF"/>
      <circle class="node" cx="513" cy="208" r="3" fill="#FFFFFF"/>
      <circle class="node" cx="696" cy="208" r="3" fill="#FFFFFF"/>
      <circle class="node" cx="880" cy="208" r="3" fill="#FFFFFF"/>
      <circle r="3.4" fill="#FFFFFF">
        <animateMotion dur="3.2s" begin="1s" repeatCount="indefinite"><mpath href="#lane3"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="3.2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text class="mono" x="900" y="212" font-size="11" letter-spacing="1.8" fill="#5B5B63">762ms MOUTH-TO-EAR</text>
    </g>

  </g>

  <rect width="1200" height="250" fill="url(#fade)"/>
</svg>
